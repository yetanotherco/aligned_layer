# PostgreSQL Monitor
postgres_monitor:
  hosts:
    agg-mode-hoodi-postgres-monitor:
      ansible_host: agg-mode-hoodi-postgres-monitor
      admin_user: admin
      ansible_user: admin
      ansible_python_interpreter: /usr/bin/python3

# PostgreSQL Primary
postgres_primary:
  hosts:
    agg-mode-hoodi-postgres-1:
      ansible_host: agg-mode-hoodi-postgres-1
      admin_user: admin
      ansible_user: admin
      ansible_python_interpreter: /usr/bin/python3

# PostgreSQL Secondary
postgres_secondary:
  hosts:
    agg-mode-hoodi-postgres-2:
      ansible_host: agg-mode-hoodi-postgres-2
      admin_user: admin
      ansible_user: admin
      ansible_python_interpreter: /usr/bin/python3

# PostgreSQL Cluster (all postgres nodes)
postgres_cluster:
  children:
    postgres_monitor:
    postgres_primary:
    postgres_secondary:

# Gateway Primary
gateway_primary:
  hosts:
    agg-mode-hoodi-gateway-1:
      ansible_host: agg-mode-hoodi-gateway-1
      admin_user: admin
      ansible_user: app
      ansible_python_interpreter: /usr/bin/python3

# Gateway Secondary
gateway_secondary:
  hosts:
    agg-mode-hoodi-gateway-2:
      ansible_host: agg-mode-hoodi-gateway-2
      admin_user: admin
      ansible_user: app
      ansible_python_interpreter: /usr/bin/python3

# Gateway Cluster (all gateway nodes)
gateway_cluster:
  children:
    gateway_primary:
    gateway_secondary:

# Metrics Server
metrics:
  hosts:
    agg-mode-hoodi-metrics:
      ansible_host: agg-mode-hoodi-metrics
      admin_user: admin
      ansible_user: admin
      ansible_python_interpreter: /usr/bin/python3

# Task Sender
task_sender:
  hosts:
    agg-mode-hoodi-sender:
      ansible_host: agg-mode-hoodi-sender
      admin_user: admin
      ansible_user: app
      ansible_python_interpreter: /usr/bin/python3

# All aggregation mode servers
aggregation_mode:
  children:
    postgres_cluster:
    gateway_cluster:
    metrics:
    task_sender:

[global]
# ============================================
# Mainnet Environment Configuration
# ============================================
# This file contains all configuration for the Mainnet environment.

# ============================================
# REQUIRED: Sensitive Values (fill these in)
# ============================================
# Database password (used by postgres, gateway, and poller)
db_password=
# Grafana read-only database user password
grafana_postgres_password=
# TLS certificates (local paths to copy from)
tls_cert_source_path=
tls_key_source_path=
# Grafana admin password
grafana_admin_password=
# Task sender private key (for sending proofs)
task_sender_private_key=
# Alerting configuration (Slack and PagerDuty)
grafana_slack_webhook_url=
grafana_pagerduty_integration_key=

# ============================================
# Environment
# ============================================
environment=mainnet
git_branch=staging

# ============================================
# PostgreSQL Configuration
# ============================================
postgres_monitor_hostname=agg-mode-mainnet-postgres-monitor
postgres_1_hostname=agg-mode-mainnet-postgres-1
postgres_2_hostname=agg-mode-mainnet-postgres-2
db_name=agg_mode
db_user=autoctl_node

# PostgreSQL Monitor
monitor_pgdata=/var/lib/postgresql/monitor
monitor_port=5432

# PostgreSQL Nodes
node_pgdata=/var/lib/postgresql/node
node_port=5432
backup_dir=/var/lib/backup

# ============================================
# Gateway & Poller Configuration
# ============================================
gateway_network=mainnet
gateway_max_daily_proofs=100
gateway_payment_service_address=0xc8631Bc1E60c20db40e474F791126212fA8255F4
gateway_eth_rpc_url=https://aligned-mainnet-rpc-1.tail665ae.ts.net

gateway_postgres_1=agg-mode-mainnet-postgres-1
gateway_postgres_2=agg-mode-mainnet-postgres-2
gateway_postgres_port=5432

# Metrics ports
gateway_metrics_port=9094
poller_metrics_port=9095

# Gateway Service Settings (same for all gateways)
gateway_port=8080
gateway_tls_enabled=true
gateway_tls_port=443
gateway_tls_cert_path=/home/app/.ssl/cert.pem
gateway_tls_key_path=/home/app/.ssl/key.pem

# Poller Service Settings (same for all pollers)
poller_last_block_fetched_filepath=/home/app/config/proof-aggregator.last_block_fetched.json
last_block_fetched_initial_value=24235289

# ============================================
# Metrics Configuration
# ============================================
prometheus_version=3.6.0
gateway_1_hostname=agg-mode-mainnet-gateway-1
gateway_2_hostname=agg-mode-mainnet-gateway-2

# Grafana Configuration
grafana_prometheus_url=http://localhost:9090
grafana_rpc_url=https://aligned-mainnet-rpc-1.tail665ae.ts.net
grafana_postgres_host=agg-mode-mainnet-postgres-1
grafana_postgres_port=5432
grafana_postgres_db=agg_mode
grafana_postgres_user=grafana
# Monitor datasource (uses same user/password as postgres datasource)
grafana_monitor_host=agg-mode-mainnet-postgres-monitor
grafana_monitor_port=5432
grafana_monitor_db=pg_auto_failover
# Public gateway URL
grafana_gateway_url=https://mainnet.gateway.alignedlayer.com
# Dashboard variables (contract addresses for dashboards)
grafana_var_payments_contract=0xc8631Bc1E60c20db40e474F791126212fA8255F4
grafana_var_proof_aggregator_contract=0xD0696d3eEebffcAB2D1b358805efAA005A9A8BC0
grafana_var_proof_aggregator_wallet=0x57628fe929016C30463473349DcDd592ea27C8b3

# ============================================
# Task Sender Configuration
# ============================================
task_sender_interval_hours=1
task_sender_proof_path=scripts/test_files/sp1/sp1_fibonacci_5_0_0.proof
task_sender_vk_path=scripts/test_files/sp1/sp1_fibonacci_5_0_0_vk.bin
task_sender_network=mainnet

[package]
name = "proof_aggregator"
version = "0.1.0"
edition = "2021"


[dependencies]
sp1-sdk = "4.1.3"
sp1_aggregator = { path = "./zkvm/sp1/" }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.0", features = ["env-filter"] }

[build-dependencies]
sp1-build = { version = "4.1.3" } 

[profile.release]
opt-level = 3
lto = true

[features]
prove = []


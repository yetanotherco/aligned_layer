name: build-and-test-rust-projects

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
    paths:
      - "batcher/**"
      - ".github/workflows/build-rust.yml"

jobs:
  build:
    runs-on: aligned-runner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            batcher/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Check formatting of Batcher
        run: |
          cd batcher
          cargo fmt --all -- --check

      - name: Run Clippy on Batcher
        run: |
          cd batcher
          cargo clippy --all -- -D warnings

      - name: Build Batcher
        run: |
          cd batcher
          cargo build --all

      - name: Check formatting of AggregationMode
        run: |
          cd aggregation_mode
          cargo fmt --all -- --check

      - name: Run Clippy on AggregationMode
        run: |
          cd aggregation_mode
          cargo clippy --all -- -D warnings

      - name: Build AggregationMode
        run: |
          cd aggregation_mode
          cargo build --all

  test:
    runs-on: aligned-runner
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.2.0

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            batcher/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Run Batcher tests
        run: |
          cd batcher
          cargo test --all

      - name: Run AggregationMode tests
        run: |
          cd aggregation_mode
          cargo test --all

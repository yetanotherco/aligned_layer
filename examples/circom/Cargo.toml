[package]
name = "circom-example"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
aligned-sdk = { path = "../../crates/sdk" }
tokio = "1.44"
alloy = { version = "0.14", features = ["full", "signer-keystore", "providers"] }
dotenv = "0.15.0"

[[bin]]
name = "main"
path = "./src/main.rs"

[[bin]]
name = "get_vk_commitment"
path = "./src/get_vk_commitment.rs"

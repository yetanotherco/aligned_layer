[package]
name = "proof_aggregator"
version = "0.1.0"
edition = "2021"


[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sp1-sdk = "4.1.3"
sp1_state_transition_program = { path = "./zkvm_programs/sp1/" }
risc0-zkvm = { version = "2.0.1" }
risc0_state_transition_program = { path = "./zkvm_programs/risc0/" }
lambdaworks-crypto = { git = "https://github.com/lambdaclass/lambdaworks.git", rev = "5f8f2cfcc8a1a22f77e8dff2d581f1166eefb80b", features = ["serde"]}
sha3 = "0.10.8"
primitive-types = { version = "0.12.0", features = ["serde"] }
rand = "0.8"

[build-dependencies]
sp1-build = { version = "4.1.3" } 
risc0-build = { version = "2.0.0" }

[package.metadata.risc0]
methods = ["./zkvm_programs/risc0"]

[profile.release]
opt-level = 3

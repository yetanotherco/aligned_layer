global:
  scrape_interval: 15s

# A scrape configuration containing exactly one endpoint to scrape.
scrape_configs:
  - job_name: "aligned-aggregator"
    scrape_interval: 1s
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          bot: "aggregator"

  - job_name: "aligned-operator"
    scrape_interval: 1s
    static_configs:
      - targets: ["host.docker.internal:9092"]
        labels:
          bot: "operator"

  - job_name: "aligned-batcher"
    scrape_interval: 1s
    static_configs:
      - targets: ["host.docker.internal:9093"]
        labels:
          bot: "batcher"

  - job_name: "aligned-tracker"
    scrape_interval: 1s
    static_configs:
      - targets: ["host.docker.internal:4001"]
        labels:
          bot: "tracker"

  - job_name: "node-exporter"
    scrape_interval: 60s
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          bot: "node-exporter"

  - job_name: "gateway-http"
    scrape_interval: 60s
    static_configs:
      - targets: ["host.docker.internal:8089"]
        labels:
          bot: "gateway-http"

  - job_name: "gateway"
    scrape_interval: 1s
    static_configs:
      - targets: ["host.docker.internal:9094"]
        labels:
          bot: "gateway"

  - job_name: "poller"
    scrape_interval: 1s
    static_configs:
      - targets: ["host.docker.internal:9095"]
        labels:
          bot: "poller"
